# FT-036 — nightly-only CI job for the diary scale test.
#
# `test/load/large_diary_replay_test.exs` seeds and replays a
# 1,000,000-entry diary; tagged :slow (test_helper.exs excludes it from
# the default `mix test` run, and ci.yml's per-push/PR `backend` job never
# runs it) since that's far too slow for the per-PR gate. This workflow
# runs it once a day instead, plus on manual dispatch for on-demand checks.
name: ci-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  MIX_ENV: test

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      - name: Diary scale test (FT-036)
        if: hashFiles('apps/loan_actor/test/load/large_diary_replay_test.exs') != ''
        run: mix test.slow
