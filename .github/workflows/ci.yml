# FT-004 — CI workflow per specs/001-loan-actor-foundation/tasks.md.
#
# Jobs:
#   backend  — mix test, mix credo --strict, mix dialyzer, mix test.smoke, mix test.load
#   frontend — npm test (Vitest), Playwright e2e against a booted backend
#
# Spec 001 is now fully implemented (FT-001..FT-040) — every step below runs
# unconditionally. (Earlier revisions guarded steps whose subject tasks
# hadn't landed yet with `hashFiles(...) != ''` checks; those guards were
# ALSO discovered to be the reason every run on this repo failed outright
# with zero jobs scheduled — "Invalid workflow file ... Unrecognized
# function: 'hashFiles'" — not merely unnecessary now that every guarded
# file exists. See audit.md's CI-run deviation entry for the full story.)
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-v1
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix credo --strict
      - run: mix dialyzer

      - name: Smoke test (quickstart.md's own checklist)
        run: mix test.smoke

      - name: Load tests (NFR budgets)
        run: mix test.load

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Restore mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-v1
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get
      - run: mix compile

      - name: Boot backend
        run: mix run --no-halt &
        env:
          MIX_ENV: dev

      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
